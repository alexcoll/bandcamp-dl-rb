# frozen_string_literal: true

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  SuggestExtensions: true

# ---- Style / layout (handled by --autocorrect) ----

# ---- Documentation ----
Style/Documentation:
  Enabled: false

# ---- Lint ----
# Inline disable/enable pairs are used deliberately for the OptionParser DSL
# macro block; prefer the clearer pair over inline next-line directives.
Style/DirectiveScope:
  Enabled: false

# ---- Metrics (deliberate, GB-domain logic / long specs) ----
Metrics/AbcSize:
  Max: 20
Metrics/MethodLength:
  Max: 40
  Exclude:
    - 'lib/bandcamp_dl_rb/cli.rb'
Metrics/ClassLength:
  Max: 220
  Exclude:
    - 'lib/bandcamp_dl_rb/cli.rb' # CLI: options/run-loop surface
    - 'lib/bandcamp_dl_rb/downloader.rb' # zone download+sidecar surface

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/bandcamp_dl_rb/cli.rb'

Metrics/BlockLength:
  Enabled: true
  Max: 40
  Exclude:
    - 'lib/bandcamp_dl_rb/cli.rb' # OptionParser option-declaration table
    - 'spec/**/*'

# ---- Naming ----
# Network-fetch helpers named get_* (get_collection, get_identity_cookie) are
# intentional; offline ops named download_*/fetch_* are not predicates.
Naming/AccessorMethodName:
  Enabled: false
Naming/PredicateMethod:
  Exclude:
    - 'lib/bandcamp_dl_rb/downloader.rb'

# ---- RSpec (the suite follows betterspecs.org) ----
RSpec/ExampleLength:
  # Short, but long enough for a stub plus an assertion on what it recorded.
  Max: 7
RSpec/MultipleMemoizedHelpers:
  # Contexts nest lets per level of setup, so a describe covering a whole
  # method legitimately declares more than the default five.
  Max: 12
RSpec/NestedGroups:
  # describe > method > situation > variant > variant. Anything deeper and a
  # reader loses track of which setup belongs to the example they are reading.
  Max: 5
RSpec/DescribeClass:
  Exclude:
    # Describe a shipped shell-completion file, not a class.
    - 'spec/bandcamp_dl_rb/completions_spec.rb'
    # Describes the roff manpage, not a class.
    - 'spec/bandcamp_dl_rb/manpage_spec.rb'
RSpec/MultipleDescribes:
  Exclude:
    # One top-level group per class under test: Firefox, Safari and the
    # auto/shared-helper behaviour around them.
    - 'spec/bandcamp_dl_rb/cookie_extractor_spec.rb'
RSpec/InstanceVariable:
  Exclude:
    # let memoises into an instance variable, and the cleanup hooks need the
    # value whether or not the example referenced the let.
    - 'spec/support/**/*'