name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build gem and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Build gem
        run: gem build bandcamp-dl-rb.gemspec

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bandcamp-dl-rb-*.gem
          generate_release_notes: true