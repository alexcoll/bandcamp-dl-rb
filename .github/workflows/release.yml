name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build gem and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/VERSION = '.*'/VERSION = '$version'/" lib/bandcamp_dl_rb/version.rb > version.tmp
          mv version.tmp lib/bandcamp_dl_rb/version.rb

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec

      - name: Build gem
        run: gem build bandcamp-dl-rb.gemspec

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bandcamp-dl-rb-*.gem
          generate_release_notes: true

      - name: Trigger Homebrew tap formula bump
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN not set, skipping tap update"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $TAP_GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/alexcoll/homebrew-tap/dispatches \
            -d '{"event_type":"formula-bump"}'