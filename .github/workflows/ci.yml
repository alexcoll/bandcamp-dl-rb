name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rubocop:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run Rubocop
        run: bundle exec rubocop --force-exclusion

  rspec:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0.7', 'head']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run RSpec
        # Parity specs run as their own jobs below. They check artifacts
        # against the parser and are identical across Ruby versions, so
        # running them here would repeat the same failure three times.
        run: bundle exec rspec --tag ~parity

  manpage:
    name: Manpage parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify manpage documents every CLI option
        run: bundle exec rspec spec/bandcamp_dl_rb/manpage_spec.rb

  completions:
    name: Completions parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Verify shell completions cover every CLI option
        run: bundle exec rspec spec/bandcamp_dl_rb/completions_spec.rb
